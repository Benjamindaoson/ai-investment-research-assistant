worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # Basic API rate limiting for gateway-level protection.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream stock_web {
        server stock-web:6060;
        keepalive 32;
    }

    upstream stock_mcp {
        server stock-mcp:7070;
        keepalive 16;
    }

    server {
        listen 8080;
        client_max_body_size 2m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ok";
        }

        # Proxy MCP server via /mcp/* and /sse.
        location /mcp/ {
            limit_req zone=api_limit burst=40 nodelay;
            rewrite ^/mcp/?(.*)$ /$1 break;
            proxy_pass http://stock_mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location = /sse {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://stock_mcp/sse;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Default route to stock-web service.
        location / {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://stock_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
