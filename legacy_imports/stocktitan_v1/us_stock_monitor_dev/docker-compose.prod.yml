services:
  mysql:
    image: mysql:8.0
    container_name: ussm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: us_stock_monitor_dev
    ports:
      - "5506:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql
      - ../us_stock_monitor_dev.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ussm-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 5s
    volumes:
      - redis_data:/data
    restart: unless-stopped

  stock-web:
    build:
      context: ./stock-web
      dockerfile: Dockerfile
    container_name: ussm-stock-web
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 6060
      DB_URL: jdbc:mysql://mysql:3306/us_stock_monitor_dev?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_PASSWORD_FILE: ${DB_PASSWORD_FILE:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD_FILE: ${REDIS_PASSWORD_FILE:-}
      APP_SECURITY_ENABLED: ${APP_SECURITY_ENABLED:-true}
      APP_SECURITY_API_KEY_HEADER: ${APP_SECURITY_API_KEY_HEADER:-X-API-KEY}
      APP_SECURITY_API_KEY: ${APP_SECURITY_API_KEY}
      APP_SECURITY_API_KEY_FILE: ${APP_SECURITY_API_KEY_FILE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - ./infra/secrets:/run/secrets:ro
    ports:
      - "6060:6060"
    restart: unless-stopped

  stock-mcp:
    build:
      context: ./stock-mcp
      dockerfile: Dockerfile
    container_name: ussm-stock-mcp
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MCP_SERVER_PORT: 7070
      DB_URL: jdbc:mysql://mysql:3306/us_stock_monitor_dev?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_PASSWORD_FILE: ${DB_PASSWORD_FILE:-}
      APP_SECURITY_ENABLED: ${APP_SECURITY_ENABLED:-true}
      APP_SECURITY_API_KEY_HEADER: ${APP_SECURITY_API_KEY_HEADER:-X-API-KEY}
      APP_SECURITY_API_KEY: ${APP_SECURITY_API_KEY}
      APP_SECURITY_API_KEY_FILE: ${APP_SECURITY_API_KEY_FILE:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.163.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_PASSWORD_FILE: ${MAIL_PASSWORD_FILE:-}
    volumes:
      - ./infra/secrets:/run/secrets:ro
    ports:
      - "7070:7070"
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    container_name: ussm-gateway
    depends_on:
      stock-web:
        condition: service_started
      stock-mcp:
        condition: service_started
    volumes:
      - ./${GATEWAY_NGINX_CONF:-infra/nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./infra/secrets/tls:/etc/nginx/tls:ro
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:8080"
      - "${GATEWAY_HTTPS_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
