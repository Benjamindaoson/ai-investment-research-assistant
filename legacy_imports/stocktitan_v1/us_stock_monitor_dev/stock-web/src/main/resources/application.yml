spring:
  application:
    name: us-stock-monitor-web
  profiles:
    active: dev
  ai:
    engine:
      base-url: ${AI_ENGINE_BASE_URL:http://127.0.0.1:8000}
    openai:
      api-key: ${OPENAI_API_KEY:sk-local-dev-placeholder}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.7
          max-tokens: 2000
    vectorstore:
      simple:
        enabled: true
    embedding:
      transformer:
        enabled: true
  task:
    scheduling:
      enabled: ${TASK_SCHEDULING_ENABLED:false}
      pool:
        size: 5

app:
  scheduler:
    enabled: ${APP_SCHEDULER_ENABLED:false}
  security:
    enabled: ${APP_SECURITY_ENABLED:false}
    api-key-header: ${APP_SECURITY_API_KEY_HEADER:X-API-KEY}
    api-key: ${APP_SECURITY_API_KEY:}
    permit-all-paths:
      - /hello/**
      - /actuator/health
      - /actuator/health/**
      - /error

logging:
  level:
    root: info

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    db:
      enabled: true
    redis:
      enabled: true

mybatis-plus:
  global-config:
    db-config:
      update-strategy: not_empty
  mapper-locations: classpath:/mappers/*.xml

baidu:
  translate:
    host: ${BAIDU_TRANSLATE_HOST:http://api.fanyi.baidu.com/api/trans/vip/translate}
    appid: ${BAIDU_TRANSLATE_APPID:local-dev-appid}
    securityKey: ${BAIDU_TRANSLATE_SECURITYKEY:local-dev-key}
    enabled: ${BAIDU_TRANSLATE_ENABLED:false}
    maxRetries: 3
    retryDelay: 1000

dingding:
  token: ${DINGDING_TOKEN:local-dev-token}
  secret: ${DINGDING_SECRET:local-dev-secret}
  userid: ${DINGDING_USERID:local-dev-user}
  enabled: ${DINGDING_ENABLED:false}
  maxRetries: 3
  retryDelay: 1000

telegram:
  token: ${TELEGRAM_TOKEN:local-dev-token}
  chatId: ${TELEGRAM_CHAT_ID:local-dev-chat}
  enabled: ${TELEGRAM_ENABLED:false}
  maxRetries: 3
  retryDelay: 1000

wechat:
  enabled: ${WECHAT_ENABLED:false}
  pythonPath: ${WECHAT_PYTHON_PATH:python}
  scriptPath: ${WECHAT_SCRIPT_PATH:}
  maxRetries: 3
  retryDelay: 1000
