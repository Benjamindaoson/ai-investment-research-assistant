server:
  port: ${SERVER_PORT:6060}

spring:
  main:
    lazy-initialization: true
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:stockdemo;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 1000ms
  ai:
    embedding:
      transformer:
        enabled: false

app:
  scheduler:
    enabled: false
  security:
    enabled: false

management:
  health:
    db:
      enabled: true
    redis:
      enabled: false
