[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-deepresearch-runtime"
version = "0.1.0"
description = "Durable, evidence-first runtime for financial deep research."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pg8000>=1.31,<2",
  "pydantic>=2.10,<3",
  "redis>=5,<8",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.8,<1", "mypy>=1.14,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: opt-in smoke against a real external service"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["deepresearch"]
