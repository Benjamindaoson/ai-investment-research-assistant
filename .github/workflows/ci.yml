name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend-research-runtime:
    name: Backend Research Runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/research-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src
      - name: Pytest offline suite
        run: python -m pytest -q -m "not integration"

  frontend-web:
    name: Frontend Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test
      - name: Production build
        run: pnpm build

  docker-build-runtime:
    name: Docker Build Runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build -t financial-deepresearch-runtime:ci ./backend/research-runtime

  docker-compose-smoke:
    name: Docker Compose Smoke
    runs-on: ubuntu-latest
    needs:
      - backend-research-runtime
      - docker-build-runtime
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: deepresearch-ci-smoke
      RUNTIME_PORT: 8011
      SMOKE_READY_TIMEOUT_SECONDS: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compose full workflow smoke
        run: bash scripts/smoke-docker-compose.sh
